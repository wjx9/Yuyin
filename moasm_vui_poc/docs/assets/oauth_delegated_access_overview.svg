<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2e6f9e"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2f855a"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b83232"/>
    </marker>
    <style>
      .title { font: 700 20px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17324d; }
      .box-title { font: 700 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17324d; }
      .text { font: 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #334e68; }
      .small { font: 12px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #486581; }
      .red { fill: #9b2c2c; }
      .green { fill: #276749; }
      .muted { fill: #718096; }
    </style>
  </defs>

  <rect width="640" height="390" rx="14" fill="#f7fafc"/>
  <text x="320" y="32" text-anchor="middle" class="title">不碰密码，不等于没有获得权限</text>

  <rect x="24" y="70" width="148" height="92" rx="10" fill="#ffffff" stroke="#9fb3c8" stroke-width="1.5"/>
  <text x="98" y="101" text-anchor="middle" class="box-title">用户</text>
  <text x="98" y="126" text-anchor="middle" class="text">输入密码 / Passkey</text>
  <text x="98" y="147" text-anchor="middle" class="small">只交给第三方</text>

  <rect x="246" y="62" width="170" height="108" rx="10" fill="#fffaf0" stroke="#d69e2e" stroke-width="1.5"/>
  <text x="331" y="91" text-anchor="middle" class="box-title">第三方登录与授权页</text>
  <text x="331" y="117" text-anchor="middle" class="text">认证用户</text>
  <text x="331" y="140" text-anchor="middle" class="text">展示并记录授权范围</text>
  <text x="331" y="159" text-anchor="middle" class="small">密码不经过我方</text>

  <rect x="468" y="70" width="148" height="92" rx="10" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.5"/>
  <text x="542" y="101" text-anchor="middle" class="box-title">我方手机端</text>
  <text x="542" y="126" text-anchor="middle" class="text">收到一次性 Code</text>
  <text x="542" y="147" text-anchor="middle" class="small">不是永久 Key</text>

  <line x1="172" y1="116" x2="238" y2="116" stroke="#b83232" stroke-width="2.2" marker-end="url(#arrow-red)"/>
  <text x="205" y="103" text-anchor="middle" class="small red">直接登录</text>

  <line x1="416" y1="116" x2="460" y2="116" stroke="#2e6f9e" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="438" y="102" text-anchor="middle" class="small">code</text>

  <rect x="84" y="226" width="190" height="104" rx="10" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/>
  <text x="179" y="256" text-anchor="middle" class="box-title">第三方 Token Endpoint</text>
  <text x="179" y="282" text-anchor="middle" class="text">校验 Code + PKCE</text>
  <text x="179" y="305" text-anchor="middle" class="text">签发短期、有限 Token</text>

  <rect x="366" y="226" width="190" height="104" rx="10" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/>
  <text x="461" y="256" text-anchor="middle" class="box-title">第三方私人资源 API</text>
  <text x="461" y="282" text-anchor="middle" class="text">按 scope / audience 执行</text>
  <text x="461" y="305" text-anchor="middle" class="text">查询行程、订票、退票</text>

  <path d="M542 162 L542 194 L179 194 L179 218" fill="none" stroke="#2f855a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <text x="365" y="188" text-anchor="middle" class="small green">端侧用 Code + verifier 换 Token</text>

  <line x1="274" y1="278" x2="358" y2="278" stroke="#2f855a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <text x="316" y="264" text-anchor="middle" class="small green">短期 Token</text>

  <rect x="126" y="350" width="388" height="26" rx="6" fill="#edf2f7" stroke="#a0aec0" stroke-dasharray="5 4"/>
  <text x="320" y="368" text-anchor="middle" class="small muted">我方云：若协议禁止云访问，则不持有 Token、不接收私人数据、不代理请求</text>
</svg>
