<svg xmlns="http://www.w3.org/2000/svg" width="640" height="310" viewBox="0 0 640 310">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#496f8a"/>
    </marker>
    <style>
      .title { font: 700 20px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17324d; }
      .box-title { font: 700 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17324d; }
      .text { font: 12px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #334e68; }
      .white { fill: #ffffff; }
      .red { fill: #9b2c2c; }
    </style>
  </defs>

  <rect width="640" height="310" rx="14" fill="#f7fafc"/>
  <text x="320" y="34" text-anchor="middle" class="title">现代方案不是保管一把万能 Key，而是拆分凭证生命周期</text>

  <rect x="20" y="78" width="130" height="86" rx="9" fill="#fffaf0" stroke="#d69e2e" stroke-width="1.5"/>
  <text x="85" y="106" text-anchor="middle" class="box-title">Authorization Code</text>
  <text x="85" y="130" text-anchor="middle" class="text">短时、一次性</text>
  <text x="85" y="149" text-anchor="middle" class="text">绑定 PKCE</text>

  <rect x="183" y="78" width="130" height="86" rx="9" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.5"/>
  <text x="248" y="106" text-anchor="middle" class="box-title">Access Token</text>
  <text x="248" y="130" text-anchor="middle" class="text">短期调用 API</text>
  <text x="248" y="149" text-anchor="middle" class="text">最小 scope / aud</text>

  <rect x="346" y="78" width="130" height="86" rx="9" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/>
  <text x="411" y="106" text-anchor="middle" class="box-title">Refresh Token</text>
  <text x="411" y="130" text-anchor="middle" class="text">只发 Token Endpoint</text>
  <text x="411" y="149" text-anchor="middle" class="text">轮换 / 重放检测</text>

  <rect x="509" y="78" width="111" height="86" rx="9" fill="#faf5ff" stroke="#805ad5" stroke-width="1.5"/>
  <text x="565" y="106" text-anchor="middle" class="box-title">撤销 / 到期</text>
  <text x="565" y="130" text-anchor="middle" class="text">退出、丢机</text>
  <text x="565" y="149" text-anchor="middle" class="text">改密、风控</text>

  <line x1="150" y1="121" x2="175" y2="121" stroke="#496f8a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="313" y1="121" x2="338" y2="121" stroke="#496f8a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="476" y1="121" x2="501" y2="121" stroke="#496f8a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="54" y="201" width="532" height="74" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="1.8"/>
  <line x1="72" y1="217" x2="106" y2="251" stroke="#c53030" stroke-width="4"/>
  <line x1="106" y1="217" x2="72" y2="251" stroke="#c53030" stroke-width="4"/>
  <text x="128" y="231" class="box-title red">拒绝：回调 URL 直接返回永久、全权限、不可撤销的 Bearer Key</text>
  <text x="128" y="255" class="text">泄漏窗口等于 Key 的寿命；PKCE、轮换、重放检测和按交易授权均无法发挥作用。</text>
</svg>
